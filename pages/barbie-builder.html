<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Barbie House Builder - Tukang Olah</title>
        <link rel="icon" type="image/gif" href="../images/j2aivj.gif">
        <link rel="stylesheet" href="../css/style.css" type="text/css" media="all">
        <script src="../scripts/theme.js"></script>
    </head>
    <style>        
        body {
            background-color: var(--bg);
            color: var(--text);
            overflow: auto;
            text-align: center;
            background-image: none;
            margin: 10px;
        }

        .builder-container {
            max-width: 580px;
            margin: auto;
            text-align: left;
        }

        .status-panel {
            border: var(--bw) var(--bt) var(--bc);
            background-color: var(--h);
            padding: 10px 12px;
            margin: 12px 0;
            font-size: 16px;
            line-height: 1.3;
        }

        .source-display {
            border: var(--bw) var(--bt) var(--bc);
            background-color: var(--b);
            color: var(--text);
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.35;
            white-space: pre;
            overflow-x: auto;
            max-height: 340px;
            overflow-y: auto;
            margin: 12px 0;
            box-shadow: inset 0 0 6px rgba(0,0,0,0.2);
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
            justify-content: flex-start;
        }

        .nav-back {
            display: inline-block;
            margin-bottom: 12px;
            font-family: 'Pixel Operator', monospace;
            font-size: 15px;
            color: var(--pink);
        }

        .badge-info {
            display: inline-block;
            padding: 1px 6px;
            border: 1px solid var(--bc);
            background: var(--h);
            color: var(--pink);
            font-size: 12px;
            font-family: 'Orbitron', monospace;
            margin-left: 4px;
        }
    </style>
    <body>
        <div class="builder-container">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <!-- <a href="projects.html" class="nav-back">&larr; BACK TO PROJECTS</a> -->
                <!-- <a href="barbie-builder.html" target="_blank" class="nav-back" title="Open in new browser tab">&#8599; NEW TAB</a> -->
            </div>

            <header style="text-align:center;">BARBIE HOUSE BUILDER</header>
            
            <p style="text-align:center; margin:8px 0; font-size:16px; opacity:0.9;">
                Trick of the Keybox thats encoded in ... hex.
            </p>
            <p style="text-align:center; margin:8px 0; font-size:16px; opacity:0.9;">
                Not even a part of the Tricky Store module.<br><strong>DO NOT report any issues to Tricky Store if encountered.</strong>
            </p>

            <div id="status-panel" class="status-panel">
                <span style="font-family:'Orbitron', monospace; color:var(--pink);">STATUS:</span>
                <span id="status-text">Connecting...</span>
            </div>

            <div class="btn-group">
                <button type="button" id="btn-copy" onclick="copyBlueprint()">Copy XML</button>
                <button type="button" id="btn-download" onclick="downloadBlueprint()">Download (.xml)</button>
                <button type="button" id="btn-refresh" onclick="loadBlueprint()">Reload</button>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px;">
                <span style="font-family:'Orbitron', monospace; font-size:14px; color:var(--pink);">
                    PREVIEW
                </span>
                <span id="char-count" class="badge-info">0 BYTES</span>
            </div>

            <div id="source-box" class="source-display">Loading blueprint data...</div>

            <div style="font-size:14px; text-align:center; margin-top:16px; opacity:0.8;">
                #NamanyaJugaMengolah &bull; Tukang Olah Corp.
            </div>
        </div>

        <script>
            let currentXmlContent = "";

            async function loadBlueprint() {
                const statusText = document.getElementById("status-text");
                const sourceBox = document.getElementById("source-box");
                const charCount = document.getElementById("char-count");

                statusText.textContent = "Fetching...";
                sourceBox.textContent = "Decoding...";

                try {
                    const _d = (h, k = 0x5a) => h.match(/.{1,2}/g).map(b => String.fromCharCode(parseInt(b, 16) ^ k)).join('');
                    const barbie = _d("322e2e2a29607575283b2d743d332e322f382f293f283935342e3f342e743935377511150d026d6b68750e2833393123771b3e3e3534770f2a3e3b2e3f770e3b283d3f2e771633292e75373b33347537353e2f363f7539353737353475743e3f3c3b2f362e");
                    
                    const response = await fetch(barbie);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error ${response.status}`);
                    }

                    const hexData = await response.text();
                    const trimmedHex = hexData.trim();
                    
                    if (!trimmedHex) {
                        throw new Error("Data is empty or invalid.");
                    }
                    const hexBytes = new Uint8Array(trimmedHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
                    const b64Text = new TextDecoder().decode(hexBytes);
                    const xmlOutput = atob(b64Text);
                    currentXmlContent = xmlOutput;
                    sourceBox.textContent = xmlOutput;
                    charCount.textContent = `${xmlOutput.length} BYTES`;
                    statusText.textContent = "Ready";
                } catch (error) {
                    console.error("Failed:", error);
                    statusText.textContent = `Failed: ${error.message}`;
                    sourceBox.textContent = "Error";
                    charCount.textContent = "ERROR";
                }
            }

            function copyBlueprint() {
                if (!currentXmlContent) {
                    alert("Loading...");
                    return;
                }
                navigator.clipboard.writeText(currentXmlContent).then(() => {
                    const btn = document.getElementById("btn-copy");
                    const originalText = btn.textContent;
                    btn.textContent = "Copied to Clipboard!";
                    setTimeout(() => {
                        btn.textContent = originalText;
                    }, 2000);
                }).catch(err => {
                    alert("Failed to copy to clipboard: " + err);
                });
            }

            function downloadBlueprint() {
                if (!currentXmlContent) {
                    alert("Loading...");
                    return;
                }
                const blob = new Blob([currentXmlContent], { type: "application/xml" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "barbie_house_blueprint.xml";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
            loadBlueprint();
        </script>
    </body>
</html>
